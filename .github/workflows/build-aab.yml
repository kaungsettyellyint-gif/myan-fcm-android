name: Build Myan+ AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -q Myan-FCM-Android-Source.zip
          test -f myan-fcm-twa/app/build.gradle
          echo "Android project OK"

      - name: Update compile SDK
        run: |
          sed -i 's/compileSdk 35/compileSdk 36/' myan-fcm-twa/app/build.gradle
          grep "compileSdk" myan-fcm-twa/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > myan-fcm-twa/upload-keystore.jks
          test -f myan-fcm-twa/upload-keystore.jks
          echo "Keystore OK"

      - name: Configure release signing
        working-directory: myan-fcm-twa
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          path = "app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          signing_block = """android {
              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in s:
              s = s.replace("android {", signing_block, 1)

          old = """buildTypes {
              release {"""

          new = """buildTypes {
              release {
                  signingConfig signingConfigs.release"""

          if "signingConfig signingConfigs.release" not in s:
              if old not in s:
                  raise SystemExit("Could not find buildTypes release block")
              s = s.replace(old, new, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("Signing configuration added correctly.")
          PY

          echo "===== build.gradle ====="
          cat app/build.gradle

      - name: Build AAB
        working-directory: myan-fcm-twa
        run: |
          gradle :app:bundleRelease --stacktrace

      - name: Check AAB
        run: |
          test -f myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
          ls -lh myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
          echo "================================"
          echo "       AAB BUILD SUCCESS"
          echo "================================"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MyanPlus-AAB
          path: myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
