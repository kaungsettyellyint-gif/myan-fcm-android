name: Build Myan+ AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -o Myan-FCM-Android-Source.zip
          echo "=== Project ==="
          ls -la myan-fcm-twa

      - name: Setup Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -20
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > myan-fcm-twa/upload-keystore.jks
          test -s myan-fcm-twa/upload-keystore.jks

      - name: Write LauncherActivity
        working-directory: myan-fcm-twa
        run: |
          cat > app/src/main/java/app/base44/myan_copy_c4c14eb9/twa/LauncherActivity.java <<'EOF'
          package app.base44.myan_copy_c4c14eb9.twa;

          import android.Manifest;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;

          import androidx.annotation.Nullable;
          import androidx.browser.customtabs.CustomTabsCallback;
          import androidx.browser.customtabs.CustomTabsSession;
          import androidx.core.content.ContextCompat;

          import com.google.androidbrowserhelper.trusted.QualityEnforcer;

          import org.json.JSONObject;

          import java.lang.reflect.Field;

          public class LauncherActivity
                  extends com.google.androidbrowserhelper.trusted.LauncherActivity {

              private static final String ORIGIN =
                      "https://myan-copy-c4c14eb9.base44.app";

              private static final String ACTION_TOKEN =
                      MyFirebaseMessagingService.ACTION_TOKEN;

              private BroadcastReceiver tokenReceiver;
              private boolean channelReady = false;

              @Override
              protected void onCreate(@Nullable Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 33 &&
                          ContextCompat.checkSelfPermission(
                                  this,
                                  Manifest.permission.POST_NOTIFICATIONS
                          ) != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.POST_NOTIFICATIONS
                              },
                              7001
                      );
                  }

                  tokenReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(
                              Context context,
                              Intent intent) {

                          if (ACTION_TOKEN.equals(intent.getAction())) {
                              sendStoredToken();
                          }
                      }
                  };

                  IntentFilter filter =
                          new IntentFilter(ACTION_TOKEN);

                  ContextCompat.registerReceiver(
                          this,
                          tokenReceiver,
                          filter,
                          ContextCompat.RECEIVER_NOT_EXPORTED
                  );
              }

              @Override
              protected void onDestroy() {
                  if (tokenReceiver != null) {
                      try {
                          unregisterReceiver(tokenReceiver);
                      } catch (Exception ignored) {
                      }
                  }

                  super.onDestroy();
              }

              private CustomTabsSession getExistingSession() {
                  try {
                      Class<?> launcherClass =
                              getClass().getSuperclass();

                      Field twaLauncherField =
                              launcherClass.getDeclaredField(
                                      "mTwaLauncher"
                              );

                      twaLauncherField.setAccessible(true);

                      Object twaLauncher =
                              twaLauncherField.get(this);

                      if (twaLauncher == null) {
                          return null;
                      }

                      Field sessionField =
                              twaLauncher.getClass()
                                      .getDeclaredField("mSession");

                      sessionField.setAccessible(true);

                      Object session =
                              sessionField.get(twaLauncher);

                      if (session instanceof CustomTabsSession) {
                          return (CustomTabsSession) session;
                      }

                  } catch (Exception ignored) {
                  }

                  return null;
              }

              @Override
              protected CustomTabsCallback getCustomTabsCallback() {

                  return new QualityEnforcer() {

                      @Override
                      public void onNavigationEvent(
                              int navigationEvent,
                              @Nullable Bundle extras) {

                          super.onNavigationEvent(
                                  navigationEvent,
                                  extras
                          );

                          if (navigationEvent != NAVIGATION_FINISHED) {
                              return;
                          }

                          CustomTabsSession session =
                                  getExistingSession();

                          if (session == null) {
                              return;
                          }

                          try {
                              session.requestPostMessageChannel(
                                      Uri.parse(ORIGIN),
                                      Uri.parse(ORIGIN),
                                      new Bundle()
                              );
                          } catch (Exception ignored) {
                          }
                      }

                      @Override
                      public void onMessageChannelReady(
                              @Nullable Bundle extras) {

                          super.onMessageChannelReady(extras);

                          channelReady = true;

                          sendStoredToken();
                      }
                  };
              }

              private void sendStoredToken() {

                  if (!channelReady) {
                      return;
                  }

                  CustomTabsSession session =
                          getExistingSession();

                  if (session == null) {
                      return;
                  }

                  SharedPreferences prefs =
                          getSharedPreferences(
                                  MyFirebaseMessagingService.PREFS,
                                  MODE_PRIVATE
                          );

                  String token =
                          prefs.getString(
                                  MyFirebaseMessagingService.KEY_TOKEN,
                                  null
                          );

                  if (token == null || token.isEmpty()) {
                      return;
                  }

                  try {
                      JSONObject object =
                              new JSONObject();

                      object.put("type", "FCM_TOKEN");
                      object.put("token", token);
                      object.put("fcmToken", token);

                      session.postMessage(
                              object.toString(),
                              null
                      );

                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

      - name: Update Android Manifest
        working-directory: myan-fcm-twa
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          service = '''
              <service
                  android:name="androidx.browser.customtabs.PostMessageService"
                  android:exported="true" />
          '''

          if "androidx.browser.customtabs.PostMessageService" not in s:
              marker = '        <service\n            android:name=".MyFirebaseMessagingService"'
              if marker in s:
                  s = s.replace(marker, service + '\n\n' + marker)

          p.write_text(s)
          PY

      - name: Write app build.gradle
        working-directory: myan-fcm-twa
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'app.base44.myan_copy_c4c14eb9.twa'

              compileSdk 36

              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              defaultConfig {
                  applicationId 'app.base44.myan_copy_c4c14eb9.twa'

                  minSdk 23
                  targetSdk 36

                  versionCode 7
                  versionName '1.3.2.1'
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release

                      minifyEnabled true
                      shrinkResources true

                      proguardFiles getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                      ), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'

              implementation platform(
                      'com.google.firebase:firebase-bom:34.18.0'
              )

              implementation 'com.google.firebase:firebase-messaging'
          }
          EOF

      - name: Build AAB
        working-directory: myan-fcm-twa
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:bundleRelease --stacktrace

      - name: Verify AAB
        run: |
          echo "=== AAB OUTPUT ==="
          ls -lh myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: myan-fcm-aab-v7
          path: myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
