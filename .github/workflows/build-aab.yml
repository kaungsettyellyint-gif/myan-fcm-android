name: Build Myan+ AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -q Myan-FCM-Android-Source.zip
          test -f myan-fcm-twa/app/build.gradle
          echo "Android project found."

      - name: Prepare build.gradle
        working-directory: myan-fcm-twa
        run: |
          python3 - <<'PY'
          path = "app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          # Update compile SDK
          s = s.replace(
              "    compileSdk 35",
              "    compileSdk 36",
              1
          )

          # Add signing configuration
          signing_config = """    signingConfigs {
              release {
                  storeFile file("../upload-keystore.jks")
                  storePassword System.getenv("STORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }

          """

          if "signingConfigs {" not in s:
              s = s.replace(
                  "    compileSdk 36\n\n",
                  "    compileSdk 36\n\n" + signing_config,
                  1
              )

          # Add signing config to release build type
          release_line = """    buildTypes {
              release {
          """

          release_replacement = """    buildTypes {
              release {
                  signingConfig signingConfigs.release
          """

          if "signingConfig signingConfigs.release" not in s:
              if release_line not in s:
                  raise SystemExit("ERROR: release block not found.")
              s = s.replace(
                  release_line,
                  release_replacement,
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("build.gradle prepared successfully.")
          PY

          echo "===== FINAL build.gradle ====="
          cat app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > myan-fcm-twa/upload-keystore.jks
          test -f myan-fcm-twa/upload-keystore.jks
          echo "Keystore decoded successfully."

      - name: Build AAB
        working-directory: myan-fcm-twa
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:bundleRelease --stacktrace

      - name: Verify AAB
        run: |
          test -f myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
          ls -lh myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
          echo "======================================"
          echo "       MYAN+ AAB BUILD SUCCESS"
          echo "======================================"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MyanPlus-AAB
          path: myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
