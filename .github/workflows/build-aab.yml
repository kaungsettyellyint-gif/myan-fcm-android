name: Build Myan+ AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -q Myan-FCM-Android-Source.zip
          echo "=== Project structure ==="
          find android-source -maxdepth 3 -type f | head -100

      - name: Verify Android project
        run: |
          test -f android-source/myan-fcm-twa/app/build.gradle
          test -f android-source/myan-fcm-twa/settings.gradle
          test -f android-source/myan-fcm-twa/google-services.json || true
          echo "Android project found successfully."

      - name: Update compile SDK
        run: |
          sed -i 's/compileSdk 35/compileSdk 36/' android-source/myan-fcm-twa/app/build.gradle
          grep -n "compileSdk" android-source/myan-fcm-twa/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android-source/myan-fcm-twa/upload-keystore.jks
          test -f android-source/myan-fcm-twa/upload-keystore.jks
          echo "Keystore decoded successfully."

      - name: Configure release signing
        working-directory: android-source/myan-fcm-twa
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import re

          path = "app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          if "signingConfigs" not in s:
              signing_block = """android {
              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """
              s = s.replace("android {", signing_block, 1)

          if "signingConfig signingConfigs.release" not in s:
              s = re.sub(
                  r"(buildTypes\\s*\\{\\s*release\\s*\\{)",
                  r"\\1\n            signingConfig signingConfigs.release",
                  s,
                  count=1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("Release signing configured.")
          PY

          echo "=== Final build.gradle ==="
          sed -n '1,120p' app/build.gradle

      - name: Build AAB
        working-directory: android-source/myan-fcm-twa
        run: |
          gradle :app:bundleRelease --stacktrace

      - name: Verify AAB
        run: |
          test -f android-source/myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
          ls -lh android-source/myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
          echo "AAB build successful."

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MyanPlus-AAB
          path: android-source/myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
