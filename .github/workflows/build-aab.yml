name: Build Myan+ AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -q Myan-FCM-Android-Source.zip
          test -f myan-fcm-twa/app/build.gradle
          echo "Android project found."

      - name: Create final build.gradle
        run: |
          cat > myan-fcm-twa/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'app.base44.myan_copy_c4c14eb9.twa'
              compileSdk 36

              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              defaultConfig {
                  applicationId 'app.base44.myan_copy_c4c14eb9.twa'
                  minSdk 23
                  targetSdk 35
                  versionCode 6
                  versionName '1.3.2.0'
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
              implementation platform('com.google.firebase:firebase-bom:34.18.0')
              implementation 'com.google.firebase:firebase-messaging'
          }
          EOF

          echo "===== FINAL build.gradle ====="
          cat myan-fcm-twa/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > myan-fcm-twa/upload-keystore.jks
          test -f myan-fcm-twa/upload-keystore.jks
          echo "Keystore ready."

      - name: Build AAB
        working-directory: myan-fcm-twa
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:bundleRelease --stacktrace

      - name: Verify AAB
        run: |
          test -f myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
          ls -lh myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
          echo "======================================"
          echo "       MYAN+ AAB BUILD SUCCESS"
          echo "======================================"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MyanPlus-AAB
          path: myan-fcm-twa/app/build/outputs/bundle/release/app-release.aab
